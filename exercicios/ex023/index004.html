<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas Nomes</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            width: 500px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border: 1px solid rgb(0, 0, 0);
        }
        thead {
            background-color: grey;
            color: white;
        }
        caption {
            font-size: 1.3em;
            margin: 5px;
            font-weight: bold;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Exercício de Tabelas</h1>
        <table>
            <caption>
                Filmes Favoritos
            </caption>
            <thead>
                <tr> </tr>
                    <th>Nome do Filme</th>
                    <th>Diretor</th>
                    <th>Ano de Lançamento</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th>Mulheres</th>
                    <td>Lucas Miguel</td>
                    <td>Um Sonho de Liberdade</td>
                    <td>O Poderoso Chefão</td>
                    <td>Batman: O Cavaleiro das Trevas</td>
                </tr>
            </tbody>
        </table>
</html>
